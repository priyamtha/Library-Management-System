<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta name="description" content="A calmer way to care for your library." />
    <title>Folio | Library management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <dialog id="book-dialog" aria-labelledby="book-dialog-title">
      <form id="book-form" method="dialog" class="book-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">COLLECTION</p>
            <h2 id="book-dialog-title">Add a book</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-dialog" aria-label="Close dialog">×</button>
        </div>
        <label>Title<input name="title" required maxlength="140" autocomplete="off" placeholder="A book worth keeping" /></label>
        <label>Author<input name="author" required maxlength="100" autocomplete="off" placeholder="Author name" /></label>
        <div class="form-row">
          <label>Category<input name="category" maxlength="40" placeholder="Fiction" /></label>
          <label>Year<input name="year" type="number" min="0" max="2100" placeholder="2024" /></label>
        </div>
        <div class="form-row">
          <label>ISBN<input name="isbn" maxlength="24" placeholder="Optional" /></label>
          <label>Total copies<input name="total" type="number" min="1" max="500" value="1" required /></label>
        </div>
        <label>Cover image URL <span class="field-optional">optional</span><input name="cover" type="url" placeholder="https://…" /></label>
        <p class="form-error" id="book-form-error" role="alert"></p>
        <button class="button button-primary dialog-submit" type="submit">Add to collection <span aria-hidden="true">↗</span></button>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
